[project]
name = "emotion-channel"
version = "0.1.0"
description = "Inject emotions (mood + intensity + duration) onto a BLE device; badge robot face is the first adopter."
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
emotion-bridge = "emotion_channel.bridge:main"

[tool.pytest.ini_options]
pythonpath = ["."]
